name: Deploy to EdgeOne Makers

# 推送 main 分支即自动构建并部署到 EdgeOne Makers 生产环境
on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持在 Actions 页面手动触发

concurrency:
  group: deploy-edgeone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 前端构建用 Node（与 package.json / vite 对齐）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Python Agents 运行时，与 EdgeOne Makers 线上 3.12 保持一致
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 构建 + 打包 + 部署：CLI 会读取 edgeone.json 的 buildCommand / outputDirectory
      - name: Deploy to EdgeOne Makers
        run: npx edgeone makers deploy -n "${{ vars.EDGEONE_PROJECT_NAME }}" -t "${{ secrets.EDGEONE_API_TOKEN }}" -e production
